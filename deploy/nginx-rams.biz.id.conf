# Cloudflare Tunnel public hostname: rams.biz.id -> http://127.0.0.1:8088
# Only accessible locally by cloudflared; no public origin ports required.
server {
    listen 127.0.0.1:8088;
    server_name rams.biz.id;
    root /var/www/rams.biz.id/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    access_log /var/log/nginx/rams.biz.id.access.log;
    error_log /var/log/nginx/rams.biz.id.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /id/;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
